<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amarante&family=Nabla&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <meta charset="utf-8" />
    <title>Styled To-Do List</title>
  </head>

  <body>
    <div class="cuadro">
      <h1>To-do List</h1>
      <ul class="todo-list">
        <li>
          <input type="checkbox" id="item_1" />
          <label for="item_1">Fix budget sheet</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://co.pinterest.com"
                target="_blank"
                >Create a new page</a
              >
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="item_2" />
          <label for="item_2">Learn to sing</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://co.pinterest.com"
                target="_blank"
                >Choose a song</a
              >
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="item_3" />
          <label for="item_3">Buy books</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://co.pinterest.com"
                target="_blank"
                >Bookstore link</a
              >
            </li>
          </ul>
        </li>

        <li>
          <input type="checkbox" id="item_4" />
          <label for="item_4">Create side quest board</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://co.pinterest.com"
                target="_blank"
                >Buy materials</a
              >
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
