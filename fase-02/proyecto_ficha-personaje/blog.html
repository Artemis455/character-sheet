<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D character sheet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="header">
      <h1>Onyx, the Paladin</h1>
    </header>
    <main class="character-sheet">
      <section class="estadisticas">
        <div class="fuerza" class="est-especifica">
          <h2>Fuerza</h2>
          <p>+2</p>
          <p>15</p>
        </div>

        <div class="destreza" class="est-especifica">
          <h2>Destreza</h2>
          <p>+1</p>
          <p>12</p>
        </div>

        <div class="constitucion" class="est-especifica">
          <h2>Constitución</h2>
          <p>+1</p>
          <p>13</p>
        </div>

        <div class="inteligencia" class="est-especifica">
          <h2>Inteligencia</h2>
          <p>-1</p>
          <p>9</p>
        </div>

        <div class="sabiduria" class="est-especifica">
          <h2>Sabiduria</h2>
          <p>0</p>
          <p>10</p>
        </div>

        <div class="carisma" class="est-especifica">
          <h2>Carisma</h2>
          <p>+3</p>
          <p>16</p>
        </div>
      </section>
    </main>
  </body>
</html>
